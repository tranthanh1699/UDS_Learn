<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UDS Lab - học UDS (ISO 14229-1), ISO-TP và CAN bằng tiếng Việt" />
    <title>UDS Lab</title>
    <script>
      // Áp dụng theme trước khi React render để tránh nháy màn hình
      try {
        var t = localStorage.getItem('udslab.theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
